<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>particle life (techiral)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="stage"></canvas>
    <div id="hud">
        <h1 id="title">particle life</h1>
        <div id="panel">
            <div class="sub" id="meta"></div>
            <div id="rel">relations, paint to rewire</div>
            <canvas id="matrix"></canvas>
            <div id="readout">drag up to pull, down to shun</div>
            <div class="row">
                <button id="btnRules">new rules</button>
                <button id="btnSoup">new soup</button>
                <button id="btnPause">pause</button>
                <button id="btnSpeed">1x</button>
            </div>
            <div class="note">click to seed, hold to gther, right-click to blast, wheel zoom, space pause, r rules, n soup, h hide</div>
            <div class="note">edges wrap, so there are no corners to pile into</div>
            <div id="credit">one file, no build, no deps</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
